name: Nightly Planning Ingest & Idox Contact Enrichment

on:
  schedule:
    # Optional full ingest. The catalogue import is Supabase pg_cron every minute.
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Ingestion source (auto, planit, london-datahub)'
        required: false
        default: 'auto'
      recent_days:
        description: 'Number of recent days to fetch'
        required: false
        default: '3'
      max_pages:
        description: 'Max pages per run (300 records/page)'
        required: false
        default: '6'
      authority:
        description: 'Optional Local Planning Authority filter'
        required: false
        default: ''

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run hybrid ingestion and Idox contact enrichment
        if: env.DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          PLANIT_MIN_INTERVAL_MS: '60000'
        run: |
          SOURCE="${{ github.event.inputs.source || 'auto' }}"
          RECENT="${{ github.event.inputs.recent_days || '3' }}"
          PAGES="${{ github.event.inputs.max_pages || '6' }}"
          AUTH="${{ github.event.inputs.authority || '' }}"
          if [ -n "$AUTH" ]; then
            pnpm ingest -- --source "$SOURCE" --recent "$RECENT" --max-pages "$PAGES" --authority "$AUTH" --enrich --enrich-limit 40
          else
            pnpm ingest -- --source "$SOURCE" --recent "$RECENT" --max-pages "$PAGES" --enrich --enrich-limit 40
          fi

